<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Blue Linear Gradient matching the square PWA icon -->
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0088f8" />
      <stop offset="50%" stop-color="#0060e2" />
      <stop offset="100%" stop-color="#0042b8" />
    </linearGradient>

    <linearGradient id="pwaCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="pwaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#002275" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full Square Canvas for PWA & Adaptive Icons -->
  <rect width="512" height="512" fill="url(#pwaBgGrad)" />

  <!-- Logo Graphics Group -->
  <g filter="url(#pwaShadow)">
    <!-- Stylized K Monogram Stem -->
    <path d="M 204 88 L 258 88 L 194 314 L 140 314 Z" fill="#ffffff" />

    <!-- Top diagonal arm of K -->
    <path d="M 218 220 L 388 136 L 288 242 Z" fill="#ffffff" />

    <!-- Head Circle -->
    <circle cx="288" cy="144" r="25" fill="#ffffff" />

    <!-- Bottom diagonal leg -->
    <path d="M 242 248 L 312 316 L 218 280 Z" fill="#ffffff" fill-opacity="0.95" />

    <!-- Bottom Curved Swoosh -->
    <path d="M 130 324 C 216 386, 318 382, 416 234 C 326 342, 212 340, 130 324 Z" fill="#ffffff" />
  </g>

  <!-- KONTINJEN Text -->
  <text x="256" y="416" text-anchor="middle" fill="#ffffff" font-family="'Lexend', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="2.5">KONTINJEN</text>

  <!-- Cyan Line Accents & KPMBP Subtitle -->
  <line x1="142" y1="446" x2="194" y2="446" stroke="url(#pwaCyanGrad)" stroke-width="4.5" stroke-linecap="round" />
  <text x="256" y="453" text-anchor="middle" fill="url(#pwaCyanGrad)" font-family="'Lexend', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="6">KPMBP</text>
  <line x1="318" y1="446" x2="370" y2="446" stroke="url(#pwaCyanGrad)" stroke-width="4.5" stroke-linecap="round" />
</svg>
